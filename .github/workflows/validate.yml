name: Validate distribution

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  distribution:
    name: Distribution / Node 18 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: node .github/scripts/validate-distribution.mjs
